name: WeBox
options:
  bundleIdPrefix: com.zhangx16
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_ENABLE_BATCH_MODE: NO
    OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -warn-long-expression-type-checking=200 -Xfrontend -warn-long-function-bodies=500 -Xfrontend -solver-expression-time-threshold=10"
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.3.0'
    CURRENT_PROJECT_VERSION: '3'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: WeBox
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    CODE_SIGN_STYLE: Automatic
    # Xcode 26 / iOS 26 SDK 构建：系统控件自动采用 Liquid Glass 外观。
    # 刻意不设置 UIDesignRequiresCompatibility，保持新设计启用。
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    revision: 288527dffbc6d3e63cce147fc7b520c64a791603
targets:
  WeBox:
    type: application
    platform: iOS
    sources:
      - path: WeBox
        excludes: [Resources]
      - path: WeBox/Resources
        buildPhase: resources
    dependencies:
      - package: MPVKit
        product: MPVKit
    info:
      path: WeBox/Info.plist
      properties:
        CFBundleDisplayName: WeBox
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [WeBoxIcon]
        CFBundleIcons~ipad:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [WeBoxIcon]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio]
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: WeBox content source
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.javascript-source, public.json, public.plain-text]
  WeBoxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WeBoxTests
      - path: TestFixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: WeBox
schemes:
  WeBox:
    build:
      targets:
        WeBox: all
        WeBoxTests: [test]
    test:
      targets: [WeBoxTests]
      gatherCoverageData: true
